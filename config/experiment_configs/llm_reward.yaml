env:
  id: merge-v0
  config:
    observation:
      type: Kinematics
      vehicles_count: 10
      features: ["presence", "x", "y", "vx", "vy"]
      normalize: true
      absolute: false
    action:
      type: DiscreteMetaAction
    duration: 30
    vehicles_count: 10
    collision_reward: -5
    reward_speed_range: [20, 30]
    high_speed_reward: 0.4
    merging_speed_reward: 0.5
    lane_change_reward: 0

ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 512
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  device: "cuda"
  verbose: 1

train:
  total_timesteps: 1000000
  seed: 42
  n_eval_episodes: 1
  n_eval_seeds: 6
  eval_seed_pool: [101, 202, 303, 404, 505, 606, 707, 808, 909, 1111, 2222, 3333]
  eval_freq: 5000
  n_envs: 12
  mode: llm_reward      # 改这里
  # 训练阶段强制 FakeLLM；正式评估再用 DeepSeek API（use_fake_llm: false）
  use_fake_llm: true
  lambda_weight: 0.5
