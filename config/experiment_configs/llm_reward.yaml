env:
  id: merge-v0
  config:
    observation:
      type: Kinematics
      vehicles_count: 10
      features: ["presence", "x", "y", "vx", "vy"]
      normalize: true
      absolute: false
    action:
      type: DiscreteMetaAction
    duration: 250
    vehicles_count: 10
    collision_reward: -5
    reward_speed_range: [20, 30]
    high_speed_reward: 2.0
    merging_speed_reward: 0.3
    lane_change_reward: 0.3

ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 512
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.02
  max_grad_norm: 0.3
  device: "cuda"
  verbose: 1

train:
  total_timesteps: 1000000
  seed: 42
  n_eval_episodes: 1
  n_eval_seeds: 24
  eval_seed_pool: [0, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 950, 1000, 1050, 1100, 1150]
  eval_freq: 6144
  n_envs: 12
  mode: llm_reward
  use_fake_llm: true
  lambda_weight: 0.5